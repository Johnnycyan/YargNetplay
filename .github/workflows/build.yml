name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # The YARG nightly to compile against (YARC-Official/YARG-BleedingEdge release tag).
  # The mod uses YARG internals, so bump this deliberately and test in game when moving to a newer YARG.
  YARG_TAG: b3912

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache YARG assemblies
        id: yarg-cache
        uses: actions/cache@v4
        with:
          path: yarg
          key: yarg-managed-${{ env.YARG_TAG }}

      # Only YARG_Data/Managed is needed (the game and Unity assemblies the mod references); they aren't committed.
      - name: Download YARG ${{ env.YARG_TAG }}
        if: steps.yarg-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$YARG_TAG" -R YARC-Official/YARG-BleedingEdge -p '*-Windows-x64.zip' -O yarg.zip
          unzip -q yarg.zip '*YARG_Data/Managed/*' -d yarg-raw
          managed="$(find yarg-raw -type d -path '*YARG_Data/Managed' | head -n 1)"
          test -n "$managed" || { echo "YARG_Data/Managed not found in the YARG zip"; exit 1; }
          mkdir -p yarg/YARG_Data
          mv "$managed" yarg/YARG_Data/Managed
          rm -rf yarg.zip yarg-raw

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          args=(-c Release "-p:YargDir=$PWD/yarg")
          # Tag builds take their version from the tag (v1.2.3 -> 1.2.3); it becomes Plugin.Version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then args+=("-p:Version=${GITHUB_REF_NAME#v}"); fi
          dotnet build YargNetplay.csproj "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: YargNetplay
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YargNetplay
          path: dist

      # The installers download releases/latest/download/YargNetplay.dll, and the mod's update check reads the
      # latest release, so every v* tag becomes the release they pick up.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" \
            --title "YARG Netplay $GITHUB_REF_NAME" --generate-notes
